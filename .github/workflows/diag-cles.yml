name: diag-cles
# Diagnostic manuel des clés LLM (Actions > diag-cles > Run workflow).
# Journal : « NOM : vivante / morte / quota », jamais une valeur. Le dépôt est
# public : rien d'autre que des noms de secrets et des statuts n'est écrit.
on:
  workflow_dispatch:
    inputs:
      generation:
        description: "Tester aussi une génération (1 requête par clé Gemini, détecte le quota)"
        type: boolean
        default: true
      modele:
        description: "Modèle Gemini du test de génération"
        type: string
        default: gemini-3.1-flash-lite
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: diagnostic
        run: node diag-cles.mjs
        env:
          DIAG_GENERATION: ${{ inputs.generation }}
          DIAG_MODELE: ${{ inputs.modele }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
