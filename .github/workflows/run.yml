name: run
on:
  workflow_call:
    inputs:
      job: { required: true, type: string }
      timeout: { required: false, type: number, default: 30 }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: run
        run: bash run.sh "${{ inputs.job }}"
        env:
          PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY }}
          # 20/10/2026 · La Revue du Luxe sur son projet Firebase dédié `la-revue-du-luxe`.
          # Retour arrière : remettre secrets.FIREBASE_SERVICE_ACCOUNT (larevue-auto-dashboard).
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SA_LRDL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_API_KEY_2: ${{ secrets.MISTRAL_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 28/10/2026 · Chaîne LLM LRDL (ai/llm-chain.js) : xAI d'abord, Groq si
          # clé, Gemini lite ensuite. Modèles facultatifs en variables du dépôt
          # (Settings > Variables) : vides = défauts du code.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          # Z.ai (GLM Flash gratuit), sauté sans clé. Textes d'actualité publics seulement.
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}
          # Ordre des fournisseurs (variable du dépôt, ex. gemini,groq,xai) ; vide = xai,groq,gemini
          LLM_ORDRE: ${{ vars.LLM_ORDRE }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
